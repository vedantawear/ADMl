        .toast.show { display: block; animation: fadeInOut 2s ease; }
        @keyframes fadeInOut {

        .login-container { max-width: 450px; width: 90%; margin: 0 auto; padding-top: 100px; }
        .login-card {
            background: rgba(15,15,22,0.7);

        .login-card p { text-align: center; color: #888; font-size: 13px; margin-bottom: 30px; }
        .input-group { margin-bottom: 20px; }
        .input-group label { display: block; margin-bottom: 8px; font-size: 13px; color: #CCCCCC; }
        .input-group input {

            background: rgba(0,0,0,0.5);

        }
        .login-btn {
            width: 100%;
            background: linear-gradient(135deg, #D4AF37, #FF8C00);
            border: none;

            border-radius: 30px;

        }
        .add-product-link {
            background: linear-gradient(135deg, #D4AF37, #FF8C00);
            padding: 10px 20px;

        .edit-modal, .datepicker-modal {

<body>
    <div id="app"></div>
    <div class="toast" id="toast"></div>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyCBZuwN4SKkXX1fEriYEwWDyTm-3uZnrKI",
            authDomain: "nexi-53897.firebaseapp.com",
            projectId: "nexi-53897",
            storageBucket: "nexi-53897.firebasestorage.app",
            messagingSenderId: "337349382612",
            appId: "1:337349382612:web:ae3c9b3d0fbf69f0e38641"
        };
        
        firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();
        
        const ADMIN_USERNAME = "vedanta";
        const ADMIN_PASSWORD = "king@63061";
        
        let isLoggedIn = localStorage.getItem('adminLoggedIn') === 'true';
        let products = [];
        let regularOrders = [];      // Non-custom orders (regular products)
        let customOrders = [];        // Custom T-Shirt orders (isCustomized === true)
        let currentEditProduct = null;
        
        function showToast(msg, isError = false) {
            const toast = document.getElementById('toast');
            toast.innerText = msg;
            toast.style.background = isError ? '#F44336' : '#D4AF37';
            toast.classList.add('show');
            setTimeout(() => toast.classList.remove('show'), 2500);
        }
        
        async function loadAllData() {
            try {
                const productsSnap = await db.collection('products').orderBy('createdAt', 'desc').get();
                products = [];
                productsSnap.forEach(doc => products.push({ id: doc.id, ...doc.data() }));
                
                const ordersSnap = await db.collection('orders').orderBy('orderDate', 'desc').get();
                regularOrders = [];
                customOrders = [];
                ordersSnap.forEach(doc => {
                    const order = { id: doc.id, ...doc.data() };
                    if (order.isCustomized === true || (order.items && order.items.some(item => item.isCustomized === true))) {
                        customOrders.push(order);
                    } else {
                        regularOrders.push(order);
                    }
                });
                
                renderProducts();
                renderRegularOrders();
                renderCustomOrders();
                updateStats();
            } catch(e) { console.error(e); showToast("Error loading data", true); }
        }
        
        function updateStats() {
            const totalProducts = products.length;
            const totalRegularOrders = regularOrders.filter(o => o.status !== 'cancelled').length;
            const totalCustomOrders = customOrders.filter(o => o.status !== 'cancelled').length;
            const totalRevenueRegular = regularOrders.filter(o => o.status !== 'cancelled').reduce((s,o) => s + (o.total || 0), 0);
            const totalRevenueCustom = customOrders.filter(o => o.status !== 'cancelled').reduce((s,o) => s + (o.total || 0), 0);
            
            document.getElementById('totalProducts') && (document.getElementById('totalProducts').innerText = totalProducts);
            document.getElementById('totalRegularOrders') && (document.getElementById('totalRegularOrders').innerText = totalRegularOrders);
            document.getElementById('totalCustomOrders') && (document.getElementById('totalCustomOrders').innerText = totalCustomOrders);
            document.getElementById('totalRevenueRegular') && (document.getElementById('totalRevenueRegular').innerText = '₹' + totalRevenueRegular.toLocaleString('en-IN'));
            document.getElementById('totalRevenueCustom') && (document.getElementById('totalRevenueCustom').innerText = '₹' + totalRevenueCustom.toLocaleString('en-IN'));
        }
        
        function renderProducts() {
            const container = document.getElementById('productsList');
            if (!container) return;
            if (products.length === 0) {
                container.innerHTML = '<div style="text-align:center; padding:40px;">📦 No products added yet.</div>';
                return;
            }
            container.innerHTML = products.map(p => `
                <div class="product-item">
                    <div class="product-img-preview">
                        ${p.images && p.images[0] ? `<img src="${p.images[0]}" alt="${escapeHtml(p.name)}">` : `<i class="fas fa-tshirt"></i>`}
                    </div>
                    <h4>${escapeHtml(p.name)}</h4>
                    <div class="product-price">₹${(p.price || 0).toLocaleString('en-IN')}</div>
                    <div class="product-category">${p.category || 'General'} • ${p.badge || ''}</div>
                    <div class="product-actions">
                        <button class="edit-btn" onclick="openEditProductModal('${p.id}')"><i class="fas fa-edit"></i> Edit</button>
                        <button class="delete-btn" onclick="deleteProductItem('${p.id}')"><i class="fas fa-trash"></i> Delete</button>
                    </div>
                </div>
            `).join('');
        }
        
        function renderRegularOrders() {
            const container = document.getElementById('regularOrdersList');
            if (!container) return;
            if (regularOrders.length === 0) {
                container.innerHTML = '<tr><td colspan="7" style="text-align:center; padding:40px;">📭 No regular orders found</td></tr>';
                return;
            }
            container.innerHTML = regularOrders.map(order => {
                const statusClass = getStatusClass(order.status);
                return `<tr>
                    <td>${order.orderId || order.id}</td>
                    <td>${new Date(order.orderDate).toLocaleDateString('en-IN')}</td>
                    <td>${escapeHtml(order.customerName || 'Guest')}</td>
                    <td>₹${(order.total || 0).toLocaleString('en-IN')}</td>
                    <td><span class="status-badge ${statusClass}">${order.status || 'pending'}</span></td>
                    <td>
                        <select class="status-select" onchange="updateOrderStatus('${order.id}', this.value, false)">
                            <option value="pending" ${order.status === 'pending' ? 'selected' : ''}>Pending</option>
                            <option value="confirmed" ${order.status === 'confirmed' ? 'selected' : ''}>Confirmed</option>
                            <option value="processing" ${order.status === 'processing' ? 'selected' : ''}>Processing</option>
                            <option value="shipped" ${order.status === 'shipped' ? 'selected' : ''}>Shipped</option>
                            <option value="delivered" ${order.status === 'delivered' ? 'selected' : ''}>Delivered</option>
                            <option value="cancelled" ${order.status === 'cancelled' ? 'selected' : ''}>Cancelled</option>
                        </select>
                    </td>
                    <td>
                        <button class="view-details" onclick="viewOrderDetails('${order.id}', false)"><i class="fas fa-eye"></i> View</button>
                        <button class="delete-order-btn" onclick="deleteOrderItem('${order.id}', false)"><i class="fas fa-trash"></i> Del</button>
                    </td>
                </tr>`;
            }).join('');
            updateStats();
        }
        
        function renderCustomOrders() {
            const container = document.getElementById('customOrdersList');
            if (!container) return;
            if (customOrders.length === 0) {
                container.innerHTML = '<tr><td colspan="8" style="text-align:center; padding:40px;">🎨 No custom design orders yet</td></tr>';
                return;
            }
            container.innerHTML = customOrders.map(order => {
                const statusClass = getStatusClass(order.status);
                const firstItem = order.items?.[0] || {};
                const frontImg = order.frontDesignImage || firstItem.frontDesignImage;
                const backImg = order.backDesignImage || firstItem.backDesignImage;
                const designPreview = frontImg ? `<div class="custom-design-thumb"><img src="${frontImg}" alt="design"></div>` : `<div class="custom-design-thumb"><i class="fas fa-palette"></i></div>`;
                return `<tr class="custom-order-highlight">
                    <td>${designPreview}</td>
                    <td>${order.orderId || order.id}</td>
                    <td>${new Date(order.orderDate).toLocaleDateString('en-IN')}</td>
                    <td>${escapeHtml(order.customerName || 'Guest')}</td>
                    <td>${firstItem.name || 'Custom T-Shirt'}</td>
                    <td>${firstItem.size || 'M'} / ${firstItem.selectedColor || 'Black'}</td>
                    <td>₹${(order.total || 0).toLocaleString('en-IN')}</td>
                    <td><span class="status-badge ${statusClass}">${order.status || 'pending'}</span></td>
                    <td>
                        <select class="status-select" onchange="updateOrderStatus('${order.id}', this.value, true)">
                            <option value="pending" ${order.status === 'pending' ? 'selected' : ''}>Pending</option>
                            <option value="confirmed" ${order.status === 'confirmed' ? 'selected' : ''}>Confirmed</option>
                            <option value="processing" ${order.status === 'processing' ? 'selected' : ''}>Processing</option>
                            <option value="shipped" ${order.status === 'shipped' ? 'selected' : ''}>Shipped</option>
                            <option value="delivered" ${order.status === 'delivered' ? 'selected' : ''}>Delivered</option>
                            <option value="cancelled" ${order.status === 'cancelled' ? 'selected' : ''}>Cancelled</option>
                        </select>
                    </td>
                    <td>
                        <button class="view-details" onclick="viewOrderDetails('${order.id}', true)"><i class="fas fa-eye"></i> View</button>
                        <button class="delete-order-btn" onclick="deleteOrderItem('${order.id}', true)"><i class="fas fa-trash"></i> Del</button>
                    </td>
                </tr>`;
            }).join('');
            updateStats();
        }
        
        function getStatusClass(status) {
            switch(status) {
                case 'confirmed': return 'status-confirmed';
                case 'processing': return 'status-processing';
                case 'shipped': return 'status-shipped';
                case 'delivered': return 'status-delivered';
                case 'cancelled': return 'status-cancelled';
                default: return 'status-pending';
            }
        }
        
        async function updateOrderStatus(orderId, newStatus, isCustom) {
            try {
                await db.collection('orders').doc(orderId).update({ status: newStatus, updatedAt: new Date().toISOString() });
                showToast(`✅ Order status updated to ${newStatus}`);
                await loadAllData();
            } catch(e) { showToast("Update failed", true); }
        }
        
        async function deleteOrderItem(orderId, isCustom) {
            if (confirm('⚠️ Delete this order permanently?')) {
                try {
                    await db.collection('orders').doc(orderId).delete();
                    showToast('✅ Order deleted');
                    await loadAllData();
                } catch(e) { showToast("Delete failed", true); }
            }
        }
        
        function viewOrderDetails(orderId, isCustom) {
            const order = isCustom ? customOrders.find(o => o.id == orderId) : regularOrders.find(o => o.id == orderId);
            if (!order) return;
            
            const itemsHtml = (order.items || []).map(item => {
                const isCustomItem = item.isCustomized || order.isCustomized;
                const frontImg = item.frontDesignImage || order.frontDesignImage;
                const backImg = item.backDesignImage || order.backDesignImage;
                const designHtml = (frontImg || backImg) ? `
                    <div class="design-preview-small">
                        ${frontImg ? `<img src="${frontImg}" title="Front Design">` : ''}
                        ${backImg ? `<img src="${backImg}" title="Back Design">` : ''}
                    </div>
                ` : '';
                
                return `
                    <div class="order-item-with-img">
                        <div class="order-product-img">
                            ${frontImg ? `<img src="${frontImg}" alt="design">` : `<i class="fas fa-palette"></i>`}
                        </div>
                        <div class="order-item-info">
                            <h4>${escapeHtml(item.name)} ${isCustomItem ? '<span class="custom-badge-detail"><i class="fas fa-paintbrush"></i> Custom Design</span>' : ''}</h4>
                            ${item.size ? `<div>📏 Size: ${escapeHtml(item.size)}</div>` : ''}
                            ${item.selectedColor ? `<div>🎨 Color: ${escapeHtml(item.selectedColor)}</div>` : ''}
                            ${designHtml}
                            <div>Quantity: ${item.quantity} × ₹${(item.price || 0).toLocaleString('en-IN')}</div>
                        </div>
                        <div class="order-item-price">₹${((item.price || 0) * (item.quantity || 1)).toLocaleString('en-IN')}</div>
                    </div>
                `;
            }).join('');
            
            document.getElementById('orderDetailContent').innerHTML = `
                <div class="order-detail-row"><strong>📋 Order ID:</strong> ${order.orderId || order.id}</div>
                <div class="order-detail-row"><strong>📅 Date:</strong> ${new Date(order.orderDate).toLocaleString()}</div>
                <div class="order-detail-row"><strong>📊 Status:</strong> <span class="status-badge ${getStatusClass(order.status)}">${order.status || 'Pending'}</span></div>
                <div class="order-detail-row"><strong>💳 Payment:</strong> ${order.paymentMethod || 'Cash on Delivery'}</div>
                ${order.isCustomized ? `<div class="order-detail-row"><strong>🎨 Order Type:</strong> <span style="color:#D4AF37;">✨ CUSTOM DESIGNED T-SHIRT</span></div>` : ''}
                <div style="margin: 15px 0; border-top: 1px solid rgba(255,255,255,0.1);"></div>
                <strong>👤 Customer Details:</strong>
                <div class="order-detail-row"><strong>Name:</strong> ${order.customerName || 'Guest'}</div>
                <div class="order-detail-row"><strong>📞 Phone:</strong> ${order.customerPhone || 'N/A'}</div>
                <div class="order-detail-row"><strong>📍 Address:</strong> ${order.shippingAddress?.address || 'N/A'}, ${order.shippingAddress?.city || ''}, ${order.shippingAddress?.state || ''} - ${order.shippingAddress?.pincode || ''}</div>
                <div style="margin: 15px 0; border-top: 1px solid rgba(255,255,255,0.1);"></div>
                <strong>🛍️ Order Items:</strong>
                ${itemsHtml || '<div>No items</div>'}
                <div style="margin-top: 15px; border-top: 1px solid #D4AF37;"></div>
                <div class="order-detail-row"><strong>💰 Total Amount:</strong> <span style="color:#D4AF37; font-size:20px;">₹${(order.total || 0).toLocaleString('en-IN')}</span></div>
            `;
            document.getElementById('orderModal').classList.add('show');
        }
        
        function closeOrderModal() { document.getElementById('orderModal').classList.remove('show'); }
        function closeEditModal() { document.getElementById('editModal').classList.remove('show'); currentEditProduct = null; }
        
        async function openEditProductModal(productId) {
            currentEditProduct = products.find(p => p.id == productId);
            if (!currentEditProduct) return;
            if (!currentEditProduct.sizes) currentEditProduct.sizes = [];
            if (!currentEditProduct.colors) currentEditProduct.colors = [];
            if (!currentEditProduct.images) currentEditProduct.images = [];
            if (!currentEditProduct.combos) currentEditProduct.combos = [];
            
            const modal = document.getElementById('editModal');
            modal.innerHTML = `
                <div class="edit-modal-content">
                    <div style="display:flex; justify-content:space-between; margin-bottom:20px;">
                        <h2 style="color:#D4AF37;">✏️ Edit Product</h2>
                        <button class="close-order-modal" onclick="closeEditModal()">&times;</button>
                    </div>
                    <div class="form-group"><label>Product Name</label><input type="text" id="editName" value="${escapeHtml(currentEditProduct.name)}"></div>
                    <div class="form-group"><label>Category</label><input type="text" id="editCategory" value="${escapeHtml(currentEditProduct.category || '')}"></div>
                    <div class="form-row">
                        <div class="form-group"><label>Price (₹)</label><input type="number" id="editPrice" value="${currentEditProduct.price}"></div>
                        <div class="form-group"><label>Badge</label><select id="editBadge"><option>Best Seller</option><option>Trending</option><option>New</option></select></div>
                    </div>
                    <div class="form-group"><label>Sizes</label><div class="chips-container" id="sizesContainer"></div><div class="add-section"><input type="text" id="newSize" placeholder="Size"><button class="add-btn" onclick="addSizeField()">+ Add</button></div></div>
                    <div class="form-group"><label>Colors</label><div class="chips-container" id="colorsContainer"></div><div class="add-section"><input type="text" id="newColorName" placeholder="Color name"><input type="color" id="newColorCode"><button class="add-btn" onclick="addColorField()">+ Add</button></div></div>
                    <div class="form-group"><label>Images</label><div class="image-preview-edit" id="imagesPreview"></div><input type="file" id="newImages" multiple accept="image/*"><button class="add-btn" onclick="uploadImages()">Upload</button></div>
                    <div class="form-group"><label>Full Description</label><textarea id="editDesc" rows="3">${escapeHtml(currentEditProduct.fullDesc || '')}</textarea></div>
                    <button class="save-edit-btn" onclick="saveProductEdit()">💾 Save Changes</button>
                </div>
            `;
            renderEditChips();
            modal.classList.add('show');
        }
        
        function renderEditChips() {
            const sizesContainer = document.getElementById('sizesContainer');
            if (sizesContainer) {
                sizesContainer.innerHTML = (currentEditProduct.sizes || []).map((s, i) => `<span class="chip">${escapeHtml(s)} <span class="remove-chip" onclick="removeSizeField(${i})">✕</span></span>`).join('');
            }
            const colorsContainer = document.getElementById('colorsContainer');
            if (colorsContainer) {
                colorsContainer.innerHTML = (currentEditProduct.colors || []).map((c, i) => `<span class="chip"><span class="color-dot-small" style="background:${c.code || '#D4AF37'}"></span> ${escapeHtml(c.name || c)} <span class="remove-chip" onclick="removeColorField(${i})">✕</span></span>`).join('');
            }
            const imagesPreview = document.getElementById('imagesPreview');
            if (imagesPreview) {
                imagesPreview.innerHTML = (currentEditProduct.images || []).map((img, i) => `<div class="edit-preview-img"><img src="${img}"><div class="remove-image-btn" onclick="removeImageField(${i})">✕</div></div>`).join('');
            }
        }
        
        function addSizeField() { const val = document.getElementById('newSize')?.value.trim().toUpperCase(); if(val && !currentEditProduct.sizes.includes(val)) { currentEditProduct.sizes.push(val); renderEditChips(); document.getElementById('newSize').value = ''; } }
        function removeSizeField(i) { currentEditProduct.sizes.splice(i,1); renderEditChips(); }
        function addColorField() { const name = document.getElementById('newColorName')?.value.trim(); const code = document.getElementById('newColorCode')?.value || '#D4AF37'; if(name) { currentEditProduct.colors.push({ name, code }); renderEditChips(); document.getElementById('newColorName').value = ''; } }
        function removeColorField(i) { currentEditProduct.colors.splice(i,1); renderEditChips(); }
        function removeImageField(i) { currentEditProduct.images.splice(i,1); renderEditChips(); }
        
        async function uploadImages() {
            const files = document.getElementById('newImages')?.files;
            if (!files || !files.length) return;
            showToast("Compressing...");
            const newImages = [];
            for (const file of files) {
                const compressed = await compressImage(file);
                newImages.push(compressed);
            }
            currentEditProduct.images.push(...newImages);
            renderEditChips();
            document.getElementById('newImages').value = '';
            showToast(`✅ ${newImages.length} images added`);
        }
        
        function compressImage(file) {
            return new Promise((resolve) => {
                const reader = new FileReader();
                reader.onload = (e) => {
                    const img = new Image();
                    img.onload = () => {
                        const canvas = document.createElement('canvas');
                        let w = img.width, h = img.height;
                        const maxDim = 800;
                        if (w > maxDim || h > maxDim) {
                            if (w > h) { h = (h * maxDim) / w; w = maxDim; }
                            else { w = (w * maxDim) / h; h = maxDim; }
                        }
                        canvas.width = w; canvas.height = h;
                        canvas.getContext('2d').drawImage(img, 0, 0, w, h);
                        resolve(canvas.toDataURL('image/jpeg', 0.7));
                    };
                    img.src = e.target.result;
                };
                reader.readAsDataURL(file);
            });
        }
        
        async function saveProductEdit() {
            const updated = {
                name: document.getElementById('editName')?.value.trim(),
                category: document.getElementById('editCategory')?.value.trim(),
                price: parseInt(document.getElementById('editPrice')?.value) || 0,
                badge: document.getElementById('editBadge')?.value,
                sizes: currentEditProduct.sizes,
                colors: currentEditProduct.colors,
                images: currentEditProduct.images,
                fullDesc: document.getElementById('editDesc')?.value,
                updatedAt: new Date().toISOString()
            };
            try {
                await db.collection('products').doc(currentEditProduct.id).update(updated);
                showToast("✅ Product updated");
                closeEditModal();
                await loadAllData();
            } catch(e) { showToast("Update failed", true); }
        }
        
        async function deleteProductItem(id) {
            if (confirm('Delete product?')) {
                try {
                    await db.collection('products').doc(id).delete();
                    showToast("Deleted");
                    await loadAllData();
                } catch(e) { showToast("Error", true); }
            }
        }
        
        function goToAddProduct() { window.location.href = 'admin-add-product.html'; }
        function openReturnManagement() { window.location.href = 'return.html'; }
        function escapeHtml(str) { if (!str) return ''; return String(str).replace(/[&<>]/g, m => ({ '&':'&amp;', '<':'&lt;', '>':'&gt;' }[m])); }
        
        function renderDashboard() {
            document.getElementById('app').innerHTML = `
                <div class="header">
                    <div class="logo"><h1>VEDANTA ADMIN <span style="font-size:10px;">Custom + Regular</span></h1></div>
                    <div class="header-buttons">
                        <button class="custom-orders-btn" id="customOrdersTabBtn"><i class="fas fa-palette"></i> Custom Orders</button>
                        <button class="return-manage-btn" id="returnManageBtn"><i class="fas fa-undo-alt"></i> Returns</button>
                        <button class="logout-btn" id="logoutBtn">Logout</button>
                    </div>
                </div>
                <div class="stats-grid">
                    <div class="stat-card"><i class="fas fa-box"></i><div class="stat-number" id="totalProducts">0</div><div class="stat-label">Products</div></div>
                    <div class="stat-card"><i class="fas fa-shopping-cart"></i><div class="stat-number" id="totalRegularOrders">0</div><div class="stat-label">Regular Orders</div></div>
                    <div class="stat-card"><i class="fas fa-paintbrush"></i><div class="stat-number" id="totalCustomOrders">0</div><div class="stat-label">Custom Orders</div></div>
                    <div class="stat-card"><i class="fas fa-rupee-sign"></i><div class="stat-number" id="totalRevenueRegular">₹0</div><div class="stat-label">Regular Revenue</div></div>
                    <div class="stat-card"><i class="fas fa-star"></i><div class="stat-number" id="totalRevenueCustom">₹0</div><div class="stat-label">Custom Revenue</div></div>
                </div>
                <div class="tabs">
                    <button class="tab-btn active" data-tab="products">📦 Products</button>
                    <button class="tab-btn" data-tab="regular">📋 Regular Orders</button>
                    <button class="tab-btn" data-tab="custom">🎨 Custom Orders</button>
                </div>
                <div class="tab-content active" id="productsTab">
                    <div style="display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:15px; margin-bottom:20px;">
                        <h3><i class="fas fa-tshirt"></i> All Products</h3>
                        <button class="add-product-link" id="addProductBtn"><i class="fas fa-plus"></i> Add New Product</button>
                    </div>
                    <div class="products-list" id="productsList"></div>
                </div>
                <div class="tab-content" id="regularTab">
                    <div class="order-filters"><div class="filter-group"><span>📋 Regular Store Orders</span></div></div>
                    <div class="orders-table"><table><thead><tr><th>Order ID</th><th>Date</th><th>Customer</th><th>Amount</th><th>Status</th><th>Update</th><th>Actions</th></tr></thead><tbody id="regularOrdersList"></tbody></table></div>
                </div>
                <div class="tab-content" id="customTab">
                    <div class="order-filters"><div class="filter-group"><span>🎨 Custom Designed T-Shirt Orders</span><span style="background:#D4AF37; color:#050508; padding:4px 12px; border-radius:20px; font-size:11px;">User uploaded front+back designs</span></div></div>
                    <div class="orders-table"><table><thead><tr><th>Design</th><th>Order ID</th><th>Date</th><th>Customer</th><th>Product</th><th>Size/Color</th><th>Amount</th><th>Status</th><th>Update</th><th>Actions</th></tr></thead><tbody id="customOrdersList"></tbody></table></div>
                </div>
                <div id="editModal" class="edit-modal"></div>
                <div id="orderModal" class="order-modal"><div class="order-modal-content"><div class="order-modal-header"><h3>📄 Order Details</h3><button class="close-order-modal" onclick="closeOrderModal()">&times;</button></div><div id="orderDetailContent"></div></div></div>
            `;
            
            document.querySelectorAll('.tab-btn').forEach(btn => {
                btn.addEventListener('click', () => {
                    document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
                    btn.classList.add('active');
                    document.querySelectorAll('.tab-content').forEach(t => t.classList.remove('active'));
                    document.getElementById(`${btn.dataset.tab}Tab`).classList.add('active');
                });
            });
            document.getElementById('addProductBtn')?.addEventListener('click', goToAddProduct);
            document.getElementById('logoutBtn')?.addEventListener('click', () => { localStorage.removeItem('adminLoggedIn'); isLoggedIn = false; renderLoginPage(); });
            document.getElementById('returnManageBtn')?.addEventListener('click', openReturnManagement);
            loadAllData();
        }
        
        function renderLoginPage() {
            document.getElementById('app').innerHTML = `
                <div class="login-container"><div class="login-card"><h2>VEDANTA ADMIN</h2><p>Enter credentials</p>
                <div class="input-group"><label>Username</label><input type="text" id="adminUsername"></div>
                <div class="input-group"><label>Password</label><input type="password" id="adminPassword"></div>
                <button class="login-btn" id="loginBtn">Login</button></div></div>
            `;
            document.getElementById('loginBtn').addEventListener('click', () => {
                const u = document.getElementById('adminUsername').value.trim();
                const p = document.getElementById('adminPassword').value.trim();
                if (u === ADMIN_USERNAME && p === ADMIN_PASSWORD) {
                    localStorage.setItem('adminLoggedIn', 'true');
                    showToast('Login success');
                    renderDashboard();
                } else { showToast('Invalid credentials', true); }
            });
        }
        
        // Make globals accessible
        window.openEditProductModal = openEditProductModal;
        window.closeEditModal = closeEditModal;
        window.saveProductEdit = saveProductEdit;
        window.deleteProductItem = deleteProductItem;
        window.updateOrderStatus = updateOrderStatus;
        window.deleteOrderItem = deleteOrderItem;
        window.viewOrderDetails = viewOrderDetails;
        window.closeOrderModal = closeOrderModal;
        window.goToAddProduct = goToAddProduct;
        window.addSizeField = addSizeField;
        window.removeSizeField = removeSizeField;
        window.addColorField = addColorField;
        window.removeColorField = removeColorField;
        window.uploadImages = uploadImages;
        window.removeImageField = removeImageField;
        
        if (isLoggedIn) renderDashboard();
        else renderLoginPage();
        
        if (typeof db !== 'undefined') {
            db.collection('products').onSnapshot(() => { if (isLoggedIn) loadAllData(); });
            db.collection('orders').onSnapshot(() => { if (isLoggedIn) loadAllData(); });
        }
    </script>
</body>
</html>
